# Every push: format, tests and lints for the core and the app.
# macOS, where the window is built and used; core has no platform code.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p draw_graph_core -p draw_graph
      - run: cargo clippy -p draw_graph_core -p draw_graph --all-targets -- -D warnings
      - run: cargo run -q -p draw_graph -- check example/draw_graph_example.rec
