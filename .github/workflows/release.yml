# A tag v* builds the Mac app for Apple silicon and Intel and attaches each
# .dmg to a draft release. Publish the draft by hand.
#
#   git tag -a v0.2.0 -m "draw_graph 0.2.0" && git push origin v0.2.0
#
# macOS only for now; Linux and Windows need their own bundle steps.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: script/bundle_macos.sh --target ${{ matrix.target }}

      # Both jobs may create the draft; the second finds it and uploads.
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "draw_graph $TAG" --notes "macOS builds of draw_graph: aarch64 for Apple silicon, x64 for Intel. Not signed: on first launch, allow it in System Settings > Privacy & Security." || true
          gh release upload "$TAG" dist/*.dmg --clobber
