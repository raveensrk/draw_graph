<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- draw_graph app icon, the source of every icons/ file:
         cd app && cargo tauri icon icons/icon.png -o icons
       after rendering this to icons/icon.png at 1024 px.
       A graph branching left to right, like the tree view: the root has the
       canvas's gold focus ring, nodes take the level colours, the dashed
       edge is an OR choice. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c212b"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#e0b84a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e0b84a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="32" cy="32" r="2.4" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS keeps a 100 px margin around an 824 px squircle-ish tile. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#dots)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Edges: elbows, as the tree view draws them. -->
  <g fill="none" stroke="#9aa3b2" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 330 512 H 430 V 340 H 560"/>
    <path d="M 430 512 H 560"/>
    <path d="M 430 512 V 684 H 560"/>
    <path d="M 640 340 H 742"/>
    <path d="M 640 684 H 742" stroke-dasharray="1 30"/>
  </g>

  <!-- Nodes: level colours from the canvas palette. -->
  <g filter="url(#shadow)">
    <rect x="530" y="288" width="140" height="104" rx="34" fill="#1f5f46"/>
    <rect x="530" y="460" width="140" height="104" rx="34" fill="#1f4f6f"/>
    <rect x="530" y="632" width="140" height="104" rx="34" fill="#6f341f"/>
    <rect x="712" y="298" width="112" height="84" rx="28" fill="#5f4f1f"/>
    <rect x="712" y="642" width="112" height="84" rx="28" fill="#5f1f4f"/>
    <circle cx="262" cy="512" r="88" fill="#e0b84a"/>
  </g>

  <!-- The focus ring the canvas puts on the focused node. -->
  <circle cx="262" cy="512" r="112" fill="none" stroke="#e0b84a" stroke-opacity="0.55" stroke-width="10"/>
</svg>
